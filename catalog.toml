# 包目录清单 — 声明「装但不部署」的软件。这不是单元（unit-model §2）：
# 目录条目不携带配置文件、没有账本生命周期，只服务两处同源消费：
# `nyxuri deps apps` 菜单与 packaging/gen-deps.py 的 optdepends。
# 显示名（双语）住 nyxuri/translations.toml 的 app_* 键，此处不重复。

[brave-origin]
label = "Brave Origin"
category = "browser"
packages_aur = ["brave-origin-bin"]

[brave-origin.platforms.ubuntu]
packages = ["brave-origin"]
reason = "Requires the official Brave APT source to be configured already."

[flclash]
label = "FlClash"
category = "proxy"
detect = "flclash"
packages_aur = ["flclash-bin"]

[flclash.platforms.ubuntu]
manual = ["flclash"]
reason = "Official releases include a prebuilt Linux .deb package; install it manually."

[quickshell]
# Nyxuri Shell 的运行时底座：随 Noctalia AUR 传递引入，单独选用
# nyxuri-shell 时由这里声明（shell/KNOWN-ISSUES 缺口清算）。
label = "Quickshell"
category = "shell-runtime"
detect = "quickshell"
packages_aur = ["quickshell"]

[quickshell.platforms.ubuntu]
packages = ["quickshell"]
reason = "Quickshell requires a separately configured APT source."

[kdenlive]
label = "Kdenlive"
category = "video"
packages = ["kdenlive"]

[kdenlive.platforms.ubuntu]
packages = ["kdenlive"]

[libreoffice]
label = "LibreOffice"
category = "office"
packages = ["libreoffice-fresh"]

[libreoffice.platforms.ubuntu]
packages = ["libreoffice"]

[lutris]
label = "Lutris"
category = "game"
packages = ["lutris"]

[lutris.platforms.ubuntu]
packages = ["lutris"]

[missioncenter]
label = "Mission Center"
category = "system"
detect = "mission-center"
packages = ["mission-center"]

[missioncenter.platforms.ubuntu]
packages = []
packages_flatpak = ["io.missioncenter.MissionCenter"]

[motrix]
label = "Motrix"
category = "download"
packages_aur = ["motrix"]
detect = "motrix"

